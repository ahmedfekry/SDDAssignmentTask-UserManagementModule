<header class="topbar">
  <button class="hamburger" aria-label="Menu">☰</button>
  <h1 class="page-title" data-i18n="users.title">Users</h1>
  <div class="spacer"></div>
  <div class="lang-switch">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="ar">ع</button>
  </div>
  <div class="user-chip">
    <span class="avatar">{{ avatarInitials() }}</span>
    <span class="u-meta">
      <span class="u-name">{{ username() }}</span><br />
      <span class="u-role">{{ roleName() }}</span>
    </span>
  </div>
</header>
