
<div class="login-page">
<div class="login-wrap">
    <div class="card login-card">
      <div class="lang-switch" style="margin-top: 10px;float: right;">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="ar">ع</button>
      </div>
      <div class="card-body">
        <h1 data-i18n="login.title">Sign in to your account</h1>
        <p class="muted" data-i18n="login.subtitle">User Management Module</p>

        <div class="alert alert-danger hidden" id="loginError" data-i18n="login.error">
          Invalid username or password. 2 attempts remaining.
        </div>

        <form id="loginForm" (submit)="FormSubmit($event)" novalidate>
          <div class="field">
            <label for="username"><span data-i18n="login.username">Username</span> <span class="req">*</span></label>
            <input class="input" type="text" id="username" name="username" autocomplete="username"
                   required data-i18n-placeholder="login.username" />
          </div>
          <div class="field">
            <label for="password"><span data-i18n="login.password">Password</span> <span class="req">*</span></label>
            <input class="input" type="password" id="password" name="password" autocomplete="current-password"
                   required data-i18n-placeholder="login.password" />
          </div>
          <button type="submit" class="btn btn-primary login-submit" data-i18n="login.submit">Sign in</button>
        </form>
      </div>
  </div>
</div>
